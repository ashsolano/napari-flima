[metadata]
name = napari-flima
version = 0.1.0
description = A Napari plugin for interactive analysis, visualization, and segmentation of FLIM (Fluorescence Lifetime Imaging Microscopy) data.
long_description = file: README.md
long_description_content_type = text/markdown
author = Ashleigh Solano
author_email = ash.solano29@hotmail.com
url = https://github.com/ashsolano/napari-flima
license = MIT
classifiers =
    Development Status :: 3 - Alpha
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Image Processing
    Framework :: Napari
keywords = napari, flim, imaging, segmentation, visualization

[options]
packages = find:
python_requires = >=3.10
install_requires =
    napari>=0.4.19
    qtpy>=2.4.1
    PyQt5>=5.15.2
    numpy>=1.26.4
    pandas>=2.0.3
    imageio>=2.33.1
    matplotlib>=3.8.0
    scipy>=1.12.0
    scikit-image>=0.24.0
    jinja2>=2.11.3
    bokeh>=3.4.0

[options.package_data]
napari_flima =
    resources/*.png

[options.entry_points]
napari.plugin =
    napari_flima = napari_flima
# Optional: if you want a console script entry point.
console_scripts =
    napari-flima = run:main







