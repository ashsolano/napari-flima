[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-flima"
version = "0.1.0"
description = "A Napari plugin for interactive analysis, visualization, and downstream of FLIM (Fluorescence Lifetime Imaging Microscopy) data."
authors = [
    { name="Ashleigh Solano", email="ash.solano29@hotmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "napari>=0.4.19",
    "qtpy>=2.4.1",
    "PyQt5>=5.15.2",
    "numpy>=1.26.4",
    "pandas>=2.0.3",
    "imageio>=2.33.1",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",
    "scikit-image>=0.24.0",
    "jinja2>=2.11.3",
    "bokeh>=3.4.0"
]
